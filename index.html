<script>
        function consultarRiesgoIncendio() {
            const zona = document.getElementById("zona-incendio").value;
            const resDiv = document.getElementById("incendio-results");
            
            // Simulación de datos paramétricos basados en condiciones reales de la región
            const datosRiesgo = {
                ascochinga: { nivel: "EXTREMO (ROJO)", humedad: "18%", viento: "Norte a 35 km/h", desc: "Prohibido hacer fuego. Alto riesgo de rápida propagación por pastizal seco." },
                punilla: { nivel: "MUY ALTO (NARANJA)", humedad: "24%", viento: "Variable a 20 km/h", desc: "Condiciones de sequía severa. Extrema precaución en zonas serranas." },
                traslasierra: { nivel: "ALTO (AMARILLO)", humedad: "32%", viento: "Leve del Sur", desc: "Riesgo moderado a alto por baja humedad ambiente." },
                calamuchita: { nivel: "EXTREMO (ROJO)", humedad: "19%", viento: "Noreste a 40 km/h", desc: "Alerta máxima por ráfagas secas y acumulón de biomasa." }
            };

            const info = datosRiesgo[zona];
            resDiv.innerHTML = `
                <strong>⚠️ Índice para ${zona.toUpperCase()}:</strong><br>
                • Peligro: <strong>${info.nivel}</strong><br>
                • Humedad del Suelo: ${info.humedad} | Viento: ${info.viento}<br>
                <em>${info.desc}</em>
            `;
        }
    </script>

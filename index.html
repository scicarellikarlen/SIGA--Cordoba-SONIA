<script>
        function consultarEstadoRuta() {
            const ruta = document.getElementById("ruta-select").value;
            const resDiv = document.getElementById("ruta-results");
            
            const estadoRutas = {
                e66: { estado: "TRANSITABLE CON PRECAUCIÓN", detalle: "Precaución por polvo en banquinas y cruce de animales sueltos en zona serrana." },
                r9: { estado: "TRANSITABLE", detalle: "Tránsito normal y fluido en ambos sentidos. Sin demoras reportadas." },
                r38: { estado: "OBRAS EN ZONA / DEMORAS", detalle: "Calzada angosta por trabajos de mantenimiento a la altura de Molinari. Conducir a baja velocidad." },
                "altas-cumbres": { estado: "TRANSITABLE CON PRECAUCIÓN", detalle: "Calzada húmeda en sectores de alta montaña por bancos de neblina matutina. Visibilidad reducida." }
            };

            const info = estadoRutas[ruta];
            resDiv.innerHTML = `
                <strong>🚦 Estado del Tramo:</strong> <span style="color: #065f46; font-weight: bold;">${info.estado}</span><br>
                <em>${info.detalle}</em>
            `;
        }
    </script>

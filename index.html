<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGA - Sistema Inteligente de Gestión Ambiental y Clima</title>
    <!-- Tailwind CSS para un diseño moderno y responsivo -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .temp-display {
            font-size: 5rem;
            line-height: 1;
            font-weight: 800;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between">

    <!-- Encabezado -->
    <header class="bg-slate-800 border-b border-slate-700 p-4 shadow-md">
        <div class="max-w-4xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
            <h1 class="text-2xl font-bold tracking-wider text-emerald-400">SIGA <span class="text-xs font-normal text-slate-400">v22 Con Alertas</span></h1>
            
            <!-- Buscador de Localidad -->
            <div class="flex w-full sm:w-auto gap-2">
                <input type="text" id="buscador-localidad" placeholder="Buscar localidad (ej. Ascochinga)..." class="bg-slate-700 px-3 py-2 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-400 w-full sm:w-64">
                <button onclick="buscarPorNombre()" class="bg-emerald-600 hover:bg-emerald-500 px-4 py-2 rounded-lg text-sm font-semibold transition">Buscar</button>
            </div>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="max-w-4xl mx-auto p-4 w-full flex-grow flex flex-col gap-6">

        <!-- Panel de Ubicación, GPS y Configuración de Alertas Telefónicas -->
        <section class="bg-slate-800 p-4 rounded-xl shadow-lg border border-slate-700 flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h2 id="nombre-ubicacion" class="text-xl font-semibold text-emerald-300">Detectando ubicación...</h2>
                <p id="coordenadas-gps" class="text-xs text-slate-400">Lat: --, Lon: --</p>
            </div>
            
            <div class="flex flex-col sm:flex-row items-center gap-2 w-full md:w-auto">
                <button onclick="obtenerUbicacionGPS()" class="bg-sky-600 hover:bg-sky-500 text-white px-3 py-2 rounded-lg text-xs font-semibold shadow transition flex items-center gap-1 whitespace-nowrap">
                    📍 Usar GPS
                </button>
                <input type="tel" id="input-telefono" placeholder="Nº Teléfono para Alertas" class="bg-slate-700 px-3 py-2 rounded-lg text-xs focus:outline-none focus:ring-2 focus:ring-emerald-400 w-full sm:w-44">
                <button onclick="guardarConfiguracionAlertas()" class="bg-emerald-600 hover:bg-emerald-500 px-3 py-2 rounded-lg text-xs font-semibold whitespace-nowrap transition">
                    🔔 Activar Alertas
                </button>
            </div>
        </section>

        <!-- Bloque Principal de Temperatura Gigante -->
        <section class="bg-gradient-to-br from-slate-800 to-slate-800/60 p-6 rounded-2xl shadow-xl border border-slate-700 text-center flex flex-col items-center justify-center relative">
            <span id="etiqueta-zona" class="text-sm uppercase tracking-widest text-emerald-400 font-semibold mb-2">Zona actual</span>
            <div class="flex items-start justify-center">
                <span id="valor-temperatura" class="temp-display text-emerald-400">--</span>
                <span class="text-4xl font-bold text-emerald-400 mt-2">°C</span>
            </div>
            <p id="estado-cielo" class="text-lg text-slate-300 mt-2 capitalize">Cargando condiciones del tiempo...</p>
        </section>

        <!-- Métricas Secundarias y Botón WhatsApp -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 flex justify-between items-center">
                <span class="text-slate-400 text-sm">Humedad</span>
                <span id="valor-humedad" class="text-xl font-bold">--%</span>
            </div>
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 flex justify-between items-center">
                <span class="text-slate-400 text-sm">Viento</span>
                <span id="valor-viento" class="text-xl font-bold">-- km/h</span>
            </div>
            <button onclick="compartirWhatsApp()" class="bg-green-600 hover:bg-green-500 text-white p-4 rounded-xl border border-green-500 flex justify-center items-center gap-2 font-semibold shadow transition">
                💬 Compartir por WhatsApp
            </button>
        </div>

        <!-- Fuentes Oficiales de Referencia -->
        <section class="bg-slate-800/40 p-4 rounded-xl border border-slate-800 text-center text-xs text-slate-400 flex flex-wrap justify-center gap-4">
            <span>Fuentes de referencia oficiales:</span>
            <a href="https://www.smn.gob.ar" target="_blank" rel="noopener noreferrer" class="text-emerald-400 hover:underline">Servicio Meteorológico Nacional</a>
            <span>•</span>
            <a href="https://weather.com" target="_blank" rel="noopener noreferrer" class="text-emerald-400 hover:underline">The Weather Channel</a>
        </section>

    </main>

    <!-- Pie de página -->
    <footer class="bg-slate-800 border-t border-slate-700 p-4 text-center text-xs text-slate-500">
        SIGA - Sistema Inteligente de Gestión Ambiental y Clima &copy; 2026
    </footer>

    <!-- Lógica JavaScript asincrónica -->
    <script>
        let latActual = -31.0833;
        let lonActual = -64.3000;
        let nombreZonaActual = "Ascochinga, Córdoba";
        let temperaturaActualValor = "--";
        let estadoActualTexto = "Cargando...";

        async function cargarClima(lat, lon, nombreLugar) {
            latActual = lat;
            lonActual = lon;
            nombreZonaActual = nombreLugar;

            document.getElementById('nombre-ubicacion').innerText = nombreLugar;
            document.getElementById('coordenadas-gps').innerText = `Lat: ${lat.toFixed(4)}, Lon: ${lon.toFixed(4)}`;
            document.getElementById('etiqueta-zona').innerText = `Zona: ${nombreLugar}`;

            try {
                const respuesta = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m`);
                const datos = await respuesta.json();

                if (datos && datos.current) {
                    temperaturaActualValor = datos.current.temperature_2m;
                    const humedad = datos.current.relative_humidity_2m;
                    const viento = datos.current.wind_speed_10m;
                    const codigoClima = datos.current.weather_code;

                    estadoActualTexto = interpretarCodigoClima(codigoClima);

                    document.getElementById('valor-temperatura').innerText = temperaturaActualValor;
                    document.getElementById('valor-humedad').innerText = `${humedad}%`;
                    document.getElementById('valor-viento').innerText = `${viento} km/h`;
                    document.getElementById('estado-cielo').innerText = estadoActualTexto;
                }
            } catch (error) {
                console.error("Error al obtener los datos del clima:", error);
                document.getElementById('estado-cielo').innerText = "Error al conectar con la estación meteorológica.";
            }
        }

        function obtenerUbicacionGPS() {
            if (navigator.geolocation) {
                document.getElementById('nombre-ubicacion').innerText = "Obteniendo señal GPS...";
                navigator.geolocation.getCurrentPosition(
                    (posicion) => {
                        const lat = posicion.coords.latitude;
                        const lon = posicion.coords.longitude;
                        cargarClima(lat, lon, "Ubicación GPS Actual");
                    },
                    (error) => {
                        alert("No se pudo obtener la ubicación por GPS. Usando ubicación predeterminada.");
                        cargarClima(-31.0833, -64.3000, "Ascochinga (Predeterminada)");
                    }
                );
            } else {
                alert("Tu dispositivo no soporta geolocalización.");
            }
        }

        async function buscarPorNombre() {
            const query = document.getElementById('buscador-localidad').value.trim();
            if (!query) return;

            try {
                const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=1&language=es&format=json`);
                const data = await res.json();

                if (data && data.results && data.results.length > 0) {
                    const lugar = data.results[0];
                    cargarClima(lugar.latitude, lugar.longitude, `${lugar.name}, ${lugar.admin1 || ''}`);
                } else {
                    alert("No se encontró la localidad especificada.");
                }
            } catch (err) {
                console.error("Error en la búsqueda:", err);
                alert("Error al buscar la localidad.");
            }
        }

        function guardarConfiguracionAlertas() {
            const telefono = document.getElementById('input-telefono').value.trim();
            if (!telefono) {
                alert("Por favor, ingresa un número de teléfono válido para configurar las alertas.");
                return;
            }
            alert(`¡Alertas configuradas exitosamente para el número ${telefono} en la zona ${nombreZonaActual}! Recibirás notificaciones en este dispositivo.`);
        }

        function compartirWhatsApp() {
            const mensaje = `⚠️ *Reporte SIGA - Clima en Vivo* ⚠️\n📍 Zona: ${nombreZonaActual}\n🌡️ Temperatura: ${temperaturaActualValor}°C\n☁️ Estado: ${estadoActualTexto}\nLat/Lon: ${latActual.toFixed(4)}, ${lonActual.toFixed(4)}`;
            const urlWp = `https://api.whatsapp.com/send?text=${encodeURIComponent(mensaje)}`;
            window.open(urlWp, '_blank');
        }

        window.onload = function() {
            cargarClima(latActual, lonActual, nombreZonaActual);
        };

        function interpretarCodigoClima(codigo) {
            const codigos = {
                0: "Cielo despejado ☀️",
                1: "Principalmente despejado 🌤️",
                2: "Parcialmente nublado ⛅",
                3: "Nublado ☁️",
                45: "Neblina 🌫️",
                51: "Llovizna ligera 🌧️",
                61: "Lluvia moderada 🌧️",
                95: "Tormenta eléctrica ⚡"
            };
            return codigos[codigo] || "Condiciones estables 🌤️";
        }
    </script>
</body>
</html>
